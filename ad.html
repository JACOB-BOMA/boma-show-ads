<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<style>

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
}

a {
  display: block;
  width: 100%;
  height: 100%;
}

img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  border: 0;
}

</style>

</head>

<body>

<a id="ad-link"
   target="_blank"
   rel="noopener sponsored">

  <img id="ad-image">

</a>

<script>

//
// Load the current ads.js file without using
// an older browser-cached version.
//

const script = document.createElement("script");

script.src = "ads.js?v=" + Date.now();

script.onload = function () {

  //
  // Determine which ad zone was requested.
  //

  const params = new URLSearchParams(window.location.search);

  const zone = params.get("zone");

  const ad = ads[zone];

  //
  // If the zone exists, display its advertisement.
  //

  if (ad) {

    const image = document.getElementById("ad-image");
    const link = document.getElementById("ad-link");

    image.src = ad.image + "?v=" + Date.now();
    image.alt = ad.alt;

    link.href = ad.url;

  } else {

    //
    // If an invalid zone was requested,
    // display nothing.
    //

    document.body.innerHTML = "";

  }

};

document.head.appendChild(script);

</script>

</body>
</html>
